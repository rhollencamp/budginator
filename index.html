<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#0f6b4a"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#141c19"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Budginator" />
    <meta
      name="description"
      content="Envelope budgeting: track spending by hand, import it from the bank, and split it across budgets."
    />
    <title>Budginator</title>
    <script>
      // Mantine switches on data-mantine-color-scheme rather than a media
      // query. Set it inline, before first paint, to avoid a flash of the light
      // theme on a dark device. This mirrors Mantine's own <ColorSchemeScript>,
      // which cannot run early enough in a client-only app: the storage key and
      // "auto" handling must stay in step with the defaultColorScheme passed to
      // MantineProvider in src/App.tsx.
      ;(function () {
        var query = window.matchMedia('(prefers-color-scheme: dark)')
        var apply = function () {
          var stored
          try {
            stored = window.localStorage.getItem('mantine-color-scheme-value')
          } catch (e) {
            stored = null
          }
          var scheme = stored === 'light' || stored === 'dark' ? stored : null
          document.documentElement.setAttribute(
            'data-mantine-color-scheme',
            scheme || (query.matches ? 'dark' : 'light'),
          )
        }
        apply()
        query.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
